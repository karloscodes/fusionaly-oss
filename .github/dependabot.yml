# Monthly, grouped version updates, each a week old at least. A person merges
# them, and they ship with the next release candidate.
# Security updates come as soon as an advisory is out, in the "security" group.
# They merge by themselves when the tests pass, and ship with the next release
# candidate too: .github/workflows/merge-security-updates.yml.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    # A new version waits a week: a compromised release is usually pulled by then.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      # Patch updates in their own group, so one minor bump does not hold them.
      go-patch:
        update-types: ["patch"]
        patterns: ["*"]
      go:
        patterns: ["*"]
      # merge-security-updates.yml knows a security update by this group name.
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # First-party modules: bumped by hand when a new version is cut.
      - dependency-name: "github.com/karloscodes/*"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    # A new version waits a week: a compromised release is usually pulled by then.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      # Patch updates in their own group, so one minor bump does not hold them.
      docker-patch:
        update-types: ["patch"]
        patterns: ["*"]
      docker:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # A new version waits a week: a compromised release is usually pulled by then.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      # Patch updates in their own group, so one minor bump does not hold them.
      actions-patch:
        update-types: ["patch"]
        patterns: ["*"]
      actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
    # A new version waits a week: a compromised release is usually pulled by then.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      # Patch updates in their own group, so one minor bump does not hold them.
      npm-web-patch:
        update-types: ["patch"]
        patterns: ["*"]
      npm-web:
        patterns: ["*"]
      # merge-security-updates.yml knows a security update by this group name.
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "monthly"
    # A new version waits a week: a compromised release is usually pulled by then.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      # Patch updates in their own group, so one minor bump does not hold them.
      npm-e2e-patch:
        update-types: ["patch"]
        patterns: ["*"]
      npm-e2e:
        patterns: ["*"]
      # merge-security-updates.yml knows a security update by this group name.
      security:
        applies-to: security-updates
        patterns: ["*"]
