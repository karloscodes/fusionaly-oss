name: Release candidate

# The release train: weekly candidates and stable releases, the fast lane, and the
# rebuild lane. The steps are in karloscodes/workflows. This file is the same in
# Formlander, LogNorth, and Fusionaly.
#
# By hand:
#   A candidate now:       gh workflow run "Release candidate"
#   Promote one now:       gh workflow run "Release candidate" -f promote=v1.5.0-rc.2
#   Stop the train:        gh workflow disable "Release candidate"
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      promote:
        description: "Candidate to promote now, for example v1.5.0-rc.2. Empty: make a candidate from main."
        required: false
        type: string
  # A merge by GITHUB_TOKEN starts no push workflow, so this listens for the
  # workflow that merged, and for the scan.
  workflow_run:
    workflows: ["Merge security updates", "Vulncheck"]
    types: [completed]

permissions:
  contents: read

jobs:
  train:
    permissions:
      contents: write
      actions: write
    uses: karloscodes/workflows/.github/workflows/release-train.yml@main
    with:
      promote: ${{ inputs.promote }}
