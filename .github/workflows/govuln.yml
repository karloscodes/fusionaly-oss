name: govulncheck

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    # Weekly catch for newly-disclosed stdlib/toolchain CVEs. A red run emails you.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Scan for reachable vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod pins an explicit `toolchain` line (not just `go 1.26`) so
          # stdlib CVEs already patched upstream don't show as reachable —
          # bump the toolchain directive when new CVEs land, no workflow
          # change needed here.
          go-version: "1.26"
          cache: true
      # golang.org/x/vuln is maintained by the Go team and verified via the Go
      # checksum DB; the vulnerability database is fetched fresh on every run.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
