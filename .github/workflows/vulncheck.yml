name: Vulncheck

# The daily vulnerability check. The steps and the repository variables are in
# karloscodes/workflows. This file is the same in every repository that has it.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  scan:
    uses: karloscodes/workflows/.github/workflows/vulncheck.yml@main
