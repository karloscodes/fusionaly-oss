name: govulncheck

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    # Weekly catch for newly-disclosed stdlib/toolchain CVEs. A red run emails you.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Scan for reachable vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # go.mod is the one source of the Go version: its `go` line pins the
          # patch release (e.g. 1.26.9), so stdlib CVEs already fixed upstream
          # don't show as reachable. Bump that line when new CVEs land.
          go-version-file: go.mod
          cache: true
      # golang.org/x/vuln is maintained by the Go team and verified via the Go
      # checksum DB; the vulnerability database is fetched fresh on every run.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
