name: govulncheck

# Vulnerabilities that the code of this repository actually calls, from the Go
# team's database. Weekly, for newly disclosed CVEs; pull requests and main are
# scanned by the govulncheck job of ci.yml. A red run emails you.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Scan for reachable vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
