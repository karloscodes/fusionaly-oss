name: Merge security updates

# Dependabot pull requests merge by themselves when CI passes on them:
#   - security updates (the "security" group in .github/dependabot.yml), and
#   - patch updates: every "from X.Y.Z to X.Y.W" in the pull request body keeps
#     its major and minor version.
# Minor and major updates wait for a person. A merge starts no release and no
# deploy: the change ships the next time a person releases or deploys.
#
# This file is the same in every product, self-hosted or SaaS. Each one names
# its test workflow "CI".
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  merge:
    # CI passed, on a pull request, from a branch of this repository (not of a
    # fork), that Dependabot made.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge a security or patch update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          body="$(gh pr view "$BRANCH" --json author,body --jq 'select(.author.login == "app/dependabot") | .body')"
          if [ -z "$body" ]; then echo "Not a pull request by Dependabot."; exit 0; fi
          if [[ "$BRANCH" != */security-* ]]; then
            pairs="$(grep -oE 'from `?v?[0-9]+\.[0-9]+\.[0-9]+[^ `]*`? to `?v?[0-9]+\.[0-9]+\.[0-9]+' <<<"$body" | tr -d '`v' | sort -u || true)"
            if [ -z "$pairs" ]; then echo "No versions found: not a patch update."; exit 0; fi
            while read -r _ from _ to; do
              if [ "${from%.*}" != "${to%.*}" ]; then echo "$from -> $to is not a patch: a person merges it."; exit 0; fi
            done <<<"$pairs"
          fi
          # --match-head-commit: merge only the commit that CI ran on.
          gh pr merge "$BRANCH" --rebase --match-head-commit "$SHA"
