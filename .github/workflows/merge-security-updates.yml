name: Merge security updates

# Merges a Dependabot security or patch update when CI passes on it. The steps are
# in karloscodes/workflows. This file is the same in every repository.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  merge:
    permissions:
      contents: write
      pull-requests: write
    uses: karloscodes/workflows/.github/workflows/merge-security-updates.yml@main
