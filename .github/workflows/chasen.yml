name: Chasen

# The install paths of Fusionaly with Chasen, each on a fresh runner: a deploy
# from a computer, the install line on a server, and the move of a server of
# the older installer. A release runs them before it publishes; a push or a
# pull request runs them when the install can change.
on:
  push:
    branches: [main]
    paths:
      - install.sh
      - e2e/*.sh
      - Dockerfile
      - scripts/entrypoint.sh
      - internal/config/**
      - .github/workflows/chasen.yml
  pull_request:
    paths:
      - install.sh
      - e2e/*.sh
      - Dockerfile
      - scripts/entrypoint.sh
      - internal/config/**
      - .github/workflows/chasen.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit SHA to test. Release passes the tag's commit. Empty uses the event ref."
        required: false
        type: string

permissions:
  contents: read

jobs:
  install:
    uses: karloscodes/workflows/.github/workflows/install-paths.yml@main
    with:
      ref: ${{ inputs.ref }}
