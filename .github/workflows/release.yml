name: Release

on:
  push:
    tags:
      - 'v*'
  # Release candidate starts it for a tag it pushed: see release-candidate.yml.
  # A tag whose own workflow is older than this file is published from main:
  #   gh workflow run Release --ref main -f tag=v2.11.0
  # The first job resolves that tag to one commit. Later jobs check that
  # commit out, and GoReleaser is pinned to the tag name.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v2.11.0. Empty: the tag this run was started on."
        required: false
        type: string

# Each job asks for what it needs. Only the jobs that publish can write.
permissions:
  contents: read

jobs:
  tag:
    name: Release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      previous: ${{ steps.resolve.outputs.previous }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the release tag
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Release runs on vX.Y.Z or vX.Y.Z-rc.N, got: ${tag}" >&2
            exit 1
          fi
          # refs/tags/ only. A branch named vX.Y.Z must not pass.
          tagged="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          # The image tags have no v: karloscodes/fusionaly:2.11.0.
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "sha=${tagged}" >> "$GITHUB_OUTPUT"

          # An rc: GoReleaser finds the previous tag itself.
          if [[ "$tag" == *-* ]]; then
            exit 0
          fi

          # The list holds this tag, so any other highest tag is above it.
          stables="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')"
          highest="$(printf '%s\n' "$stables" | head -1)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$tag" != "$highest" ]; then
            echo "Refusing ${tag}: ${highest} is the newest stable tag, and ${tag} would move latest back." >&2
            exit 1
          fi
          previous="$(printf '%s\n' "$stables" | awk -v cur="$tag" '$0 == cur { found = 1; next } found { print; exit }')"
          if [ -z "$previous" ]; then
            echo "No stable tag before ${tag}." >&2
            exit 1
          fi
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: tag
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          go mod download
          go mod tidy

      - name: Build web assets and minify SDK
        run: |
          cd web
          npm install --legacy-peer-deps
          npx esbuild ../api/v1/sdk.js --minify --bundle=false --outfile=../api/v1/sdk.min.js
          npm run build

      - name: Run unit tests
        run: FUSIONALY_ENV=test go test -v ./...

  test-manager:
    name: Test Manager Binary
    runs-on: ubuntu-latest
    needs: tag
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build manager binary
        run: |
          mkdir -p tmp
          go build -o tmp/fusionaly-manager ./cmd/manager

      - name: Test manager commands
        run: |
          echo "Testing version command..."
          ./tmp/fusionaly-manager version

          echo "Testing help command..."
          ./tmp/fusionaly-manager help

          echo "Manager binary tests passed!"

      - name: Run manager integration tests
        run: FUSIONALY_ENV=test go test -v ./internal/manager -run "TestManager"

  test-install:
    name: Install Test
    runs-on: ubuntu-latest
    needs: tag
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Build web assets
        run: |
          cd web
          npm install --legacy-peer-deps
          npm run build

      - name: Build Docker image locally
        run: docker build -t fusionaly:test .

      - name: The image binary's Go matches go.mod
        run: |
          set -euo pipefail
          want=$(awk '/^go / { print $2; exit }' go.mod)
          id=$(docker create fusionaly:test)
          docker cp "$id:/app/fusionaly-server" /tmp/fusionaly-server
          docker rm "$id" >/dev/null
          got=$(go version -m /tmp/fusionaly-server | awk 'NR==1 { sub(/^go/, "", $2); print $2 }')
          echo "go.mod go $want; binary go $got"
          [ "$got" = "$want" ]

      - name: Build manager
        run: go build -o bin/fusionaly ./cmd/manager

      - name: Run install
        run: echo -e "localhost\ny\n" | sudo -E ./bin/fusionaly install
        env:
          FUSIONALY_ENV: test
          APP_IMAGE: fusionaly:test

      - name: Verify install
        run: |
          sleep 5
          docker ps
          docker ps --format '{{.Names}}' | grep -q "fusionaly"
          for _ in {1..12}; do
            curl -sf http://localhost/_health && exit 0
            sleep 5
          done
          exit 1

      - name: Logs on failure
        if: failure()
        run: |
          docker ps -a
          docker logs fusionaly-app-1 2>&1 | tail -100 || true
          docker logs fusionaly-caddy 2>&1 | tail -50 || true

  # The commit the tag job resolved. Not the ref this workflow was started on.
  chasen:
    needs: tag
    uses: ./.github/workflows/chasen.yml
    with:
      ref: ${{ needs.tag.outputs.sha }}

  release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: [tag, test, test-manager, test-install, chasen]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The installed Go must be the go line in go.mod, and the image tag
      # must name that same release. A future toolchain line must be kept
      # in sync: setup-go installs it instead of the go line.
      - name: Check the release Go
        run: |
          set -euo pipefail
          mod="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          got="$(go env GOVERSION)"
          if [ -z "${mod}" ] || [ -z "${got}" ] || [ "${got}" != "go${mod}" ]; then
            echo "go env GOVERSION is '${got:-}', want go${mod:-}"
            exit 1
          fi
          tag="$(awk '$1 == "FROM" && $2 ~ /^golang:/ { sub(/^golang:/, "", $2); print $2; exit }' Dockerfile)"
          ver="${tag%%-*}"
          if [ -z "${ver}" ] || [ "${ver}" != "${mod}" ]; then
            echo "Dockerfile FROM golang:${tag:-} does not match go ${mod}"
            exit 1
          fi
          echo "Release Go is ${got}; image is golang:${tag}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the tag. GoReleaser's default sort (-version:refname) lists
          # v2.11.0-rc.3 ahead of v2.11.0 when both point at HEAD, and
          # prerelease: auto then follows that rc tag. Stable notes start at
          # the previous stable tag, not at the rc that shares this commit.
          GORELEASER_CURRENT_TAG: ${{ needs.tag.outputs.tag }}
          GORELEASER_PREVIOUS_TAG: ${{ needs.tag.outputs.previous }}

  scan:
    name: Scan the release image
    runs-on: ubuntu-latest
    needs: [tag, release]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'karloscodes/fusionaly:${{ needs.tag.outputs.version }}'
          format: 'sarif'
          output: 'trivy-docker-results.sarif'
        continue-on-error: true

      - name: Upload Docker scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-docker-results.sarif'
        continue-on-error: true
