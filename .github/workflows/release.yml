name: Release

on:
  push:
    tags:
      - 'v*'
  # Release candidate starts it for a tag it pushed: see release-candidate.yml.
  # A tag whose own workflow is older than this file is published from main:
  #   gh workflow run Release --ref main -f tag=v2.11.0
  # The jobs below check that tag out. GoReleaser is pinned to it, because two
  # tags on one commit otherwise sort to the prerelease.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v2.11.0. Empty: the tag this run was started on."
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: The checkout is the release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Release runs on vX.Y.Z or vX.Y.Z-rc.N, got: ${tag}"
            exit 1
          fi
          head="$(git rev-parse HEAD)"
          tagged="$(git rev-parse "${tag}^{}")"
          echo "tag ${tag} is ${tagged}; HEAD is ${head}"
          [ "$head" = "$tagged" ]
          if [[ "$tag" == *-* ]]; then
            echo "${tag} is a release candidate"
          else
            echo "${tag} is stable, so GoReleaser will not mark it as a prerelease"
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          go mod download
          go mod tidy

      - name: Build web assets and minify SDK
        run: |
          cd web
          npm install --legacy-peer-deps
          npx esbuild ../api/v1/sdk.js --minify --bundle=false --outfile=../api/v1/sdk.min.js
          npm run build

      - name: Run unit tests
        run: FUSIONALY_ENV=test go test -v ./...

  test-manager:
    name: Test Manager Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: The checkout is the release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Release runs on vX.Y.Z or vX.Y.Z-rc.N, got: ${tag}"
            exit 1
          fi
          head="$(git rev-parse HEAD)"
          tagged="$(git rev-parse "${tag}^{}")"
          echo "tag ${tag} is ${tagged}; HEAD is ${head}"
          [ "$head" = "$tagged" ]
          if [[ "$tag" == *-* ]]; then
            echo "${tag} is a release candidate"
          else
            echo "${tag} is stable, so GoReleaser will not mark it as a prerelease"
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build manager binary
        run: |
          mkdir -p tmp
          go build -o tmp/fusionaly-manager ./cmd/manager

      - name: Test manager commands
        run: |
          echo "Testing version command..."
          ./tmp/fusionaly-manager version

          echo "Testing help command..."
          ./tmp/fusionaly-manager help

          echo "Manager binary tests passed!"

      - name: Run manager integration tests
        run: FUSIONALY_ENV=test go test -v ./internal/manager -run "TestManager"

  test-install:
    name: Install Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: The checkout is the release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Release runs on vX.Y.Z or vX.Y.Z-rc.N, got: ${tag}"
            exit 1
          fi
          head="$(git rev-parse HEAD)"
          tagged="$(git rev-parse "${tag}^{}")"
          echo "tag ${tag} is ${tagged}; HEAD is ${head}"
          [ "$head" = "$tagged" ]
          if [[ "$tag" == *-* ]]; then
            echo "${tag} is a release candidate"
          else
            echo "${tag} is stable, so GoReleaser will not mark it as a prerelease"
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build web assets
        run: |
          cd web
          npm install --legacy-peer-deps
          npm run build

      - name: Build Docker image locally
        run: docker build -t fusionaly:test .

      - name: The image binary's Go matches go.mod
        run: |
          set -euo pipefail
          want=$(awk '/^go / { print $2; exit }' go.mod)
          id=$(docker create fusionaly:test)
          docker cp "$id:/app/fusionaly-server" /tmp/fusionaly-server
          docker rm "$id" >/dev/null
          got=$(go version -m /tmp/fusionaly-server | awk 'NR==1 { sub(/^go/, "", $2); print $2 }')
          echo "go.mod go $want; binary go $got"
          [ "$got" = "$want" ]

      - name: Build manager
        run: go build -o bin/fusionaly ./cmd/manager

      - name: Run install
        run: echo -e "localhost\ny\n" | sudo -E ./bin/fusionaly install
        env:
          FUSIONALY_ENV: test
          APP_IMAGE: fusionaly:test

      - name: Verify install
        run: |
          sleep 5
          docker ps
          docker ps --format '{{.Names}}' | grep -q "fusionaly"
          for i in {1..12}; do
            curl -sf http://localhost/_health && exit 0
            sleep 5
          done
          exit 1

      - name: Logs on failure
        if: failure()
        run: |
          docker ps -a
          docker logs fusionaly-app-1 2>&1 | tail -100 || true
          docker logs fusionaly-caddy 2>&1 | tail -50 || true

  # The install paths with Chasen: see chasen.yml. Test the tag being
  # released, which is this run's ref unless workflow_dispatch names one.
  chasen:
    uses: ./.github/workflows/chasen.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

  release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: [test, test-manager, test-install, chasen]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: The checkout is the release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Release runs on vX.Y.Z or vX.Y.Z-rc.N, got: ${tag}"
            exit 1
          fi
          head="$(git rev-parse HEAD)"
          tagged="$(git rev-parse "${tag}^{}")"
          echo "tag ${tag} is ${tagged}; HEAD is ${head}"
          [ "$head" = "$tagged" ]
          if [[ "$tag" == *-* ]]; then
            echo "${tag} is a release candidate"
          else
            echo "${tag} is stable, so GoReleaser will not mark it as a prerelease"
          fi
          # The GoReleaser step reads this. It is the tag the guard just
          # checked, which is GITHUB_REF_NAME unless the dispatch input set one.
          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the tag. GoReleaser's default sort (-version:refname) lists
          # v2.11.0-rc.3 ahead of v2.11.0 when both point at HEAD, and
          # prerelease: auto then follows that rc tag.
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}
