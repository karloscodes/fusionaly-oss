name: CI

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: |
          go mod download
          go mod tidy
          make install-tools
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2

      - name: Install web dependencies
        run: |
          cd web
          npm install --legacy-peer-deps

      - name: Build web assets
        run: |
          cd web
          npm run build

      - name: Install Playwright browsers
        run: |
          cd e2e
          npm install
          npx playwright install --with-deps chromium

      - name: Run tests
        run: |
          make test
          make test-e2e

  test-manager:
    name: Test Manager Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and test manager
        run: |
          mkdir -p tmp
          go build -o tmp/fusionaly-manager ./cmd/manager

          echo "=== Manager version ==="
          ./tmp/fusionaly-manager version

          echo "=== Manager help ==="
          ./tmp/fusionaly-manager help

          echo "=== Manager integration tests ==="
          FUSIONALY_ENV=test go test -v ./internal/manager -run "TestManager"

  test-install:
    name: Install Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build manager
        run: go build -o bin/fusionaly ./cmd/manager

      - name: Run install
        run: echo -e "localhost\ny\n" | sudo -E ./bin/fusionaly install
        env:
          FUSIONALY_ENV: test

      - name: Verify install
        run: |
          sleep 5
          docker ps
          docker ps --format '{{.Names}}' | grep -q "fusionaly"
          for i in {1..12}; do
            curl -sf http://localhost/_health && exit 0
            sleep 5
          done
          exit 1

      - name: Logs on failure
        if: failure()
        run: |
          docker ps -a
          docker logs fusionaly-app-1 2>&1 | tail -100 || true
          docker logs fusionaly-caddy 2>&1 | tail -50 || true


  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the history for secrets
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks_8.28.0_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.28.0_linux_x64.tar.gz gitleaks
          ./gitleaks git --redact --verbose .
  # The one check to require on main: it passes when every job above passed
  # (or was skipped on a fork).
  test:
    name: test
    if: always()
    needs: [gitleaks, tests, test-manager, test-install]
    runs-on: ubuntu-latest
    steps:
      - run: |
          ! grep -qE "failure|cancelled" <<<"${{ join(needs.*.result, ' ') }}"
