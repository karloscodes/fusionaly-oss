name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: |
          go mod download
          go mod tidy
          make install-tools
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2

      - name: Install web dependencies
        run: |
          cd web
          npm install --legacy-peer-deps

      - name: Build web assets
        run: |
          cd web
          npm run build

      - name: Install Playwright browsers
        run: |
          cd e2e
          npm ci
          version=$(node -p "require('playwright/package.json').version")
          echo "Playwright $version"
          # npm ci follows the lockfile. Install the browsers this package asks for.
          rm -rf "${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}"
          npx playwright install --with-deps chromium

      # The code embeds the minified SDK, so vet needs it built.
      - name: Vet
        run: make minify-sdk && go vet ./...
      - name: Run tests
        run: |
          make test GOTESTFLAGS=-race
          make test-e2e

  test-manager:
    name: Test Manager Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and test manager
        run: |
          mkdir -p tmp
          go build -o tmp/fusionaly-manager ./cmd/manager

          echo "=== Manager version ==="
          ./tmp/fusionaly-manager version

          echo "=== Manager help ==="
          ./tmp/fusionaly-manager help

          echo "=== Manager integration tests ==="
          FUSIONALY_ENV=test go test -v ./internal/manager -run "TestManager"

  test-install:
    name: Install Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build manager
        run: go build -o bin/fusionaly ./cmd/manager

      - name: Run install
        run: echo -e "localhost\ny\n" | sudo -E ./bin/fusionaly install
        env:
          FUSIONALY_ENV: test

      - name: Verify install
        run: |
          sleep 5
          docker ps
          docker ps --format '{{.Names}}' | grep -q "fusionaly"
          for i in {1..12}; do
            curl -sf http://localhost/_health && exit 0
            sleep 5
          done
          exit 1

      - name: Logs on failure
        if: failure()
        run: |
          docker ps -a
          docker logs fusionaly-app-1 2>&1 | tail -100 || true
          docker logs fusionaly-caddy 2>&1 | tail -50 || true


  # The app embeds built files (web/dist, the minified SDK). The scans only need
  # them to exist.
  security:
    uses: karloscodes/workflows/.github/workflows/go-security.yml@v1.1.0
    with:
      prepare: "mkdir -p web/dist/assets web/dist/.vite && touch web/dist/assets/stub.txt api/v1/sdk.min.js && echo '{}' > web/dist/.vite/manifest.json"
      gosec-flags: "-exclude-dir=e2e"
      check-dockerfile: true

  gitleaks:
    uses: karloscodes/workflows/.github/workflows/gitleaks.yml@v1.1.0

  # The one check to require on main: it passes when every job above passed
  # (or was skipped on a fork).
  test:
    name: test
    if: always()
    needs: [gitleaks, security, tests, test-manager, test-install]
    runs-on: ubuntu-latest
    steps:
      - run: |
          ! grep -qE "failure|cancelled" <<<"${{ join(needs.*.result, ' ') }}"
