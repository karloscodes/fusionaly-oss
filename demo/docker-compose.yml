services:
  fusionaly-web:
    image: karloscodes/fusionaly:latest
    pull_policy: always
    container_name: fusionaly-demo
    environment:
      # Required for demo functionality
      - FUSIONALY_ENV=test
      - FUSIONALY_DOMAIN=localhost
      - FUSIONALY_APP_PORT=8080
      # Test mode listens on loopback only; Caddy reaches it on the demo's own network.
      - FUSIONALY_HOST=0.0.0.0
      # Optional: Better demo experience
      - FUSIONALY_LOG_LEVEL=info
      - FUSIONALY_JOB_INTERVAL_SECONDS=3
      - TZ=UTC
    volumes:
      - fusionaly_storage:/app/storage
      - fusionaly_logs:/app/logs
    restart: unless-stopped
    networks:
      - fusionaly-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/_health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2.9-alpine
    container_name: caddy-demo
    environment:
      - DOMAIN=localhost
    ports:
      - "127.0.0.1:8080:8080" # this computer only: the app runs in test mode
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./index.html:/usr/share/caddy/devbox.html:ro
      - ./index.html:/usr/share/caddy/alt.html:ro # the demo's subpage: the same page under another path
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - fusionaly-network
    depends_on:
      fusionaly-web:
        condition: service_healthy

volumes:
  fusionaly_storage:
  fusionaly_logs:
  caddy_data:
  caddy_config:

networks:
  fusionaly-network:
    driver: bridge
